server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API, including the streaming /api/ask (Server-Sent Events).
  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # send each answer token as soon as it arrives
    proxy_read_timeout 300s;      # long answers from slow local models
    client_max_body_size 50m;     # PDF uploads (matches MAX_UPLOAD_MB)
  }

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
